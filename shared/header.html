 <header>
    <div class="container">
        <div class="header-content">
            <!-- Logo MBC avec image et fallback élégant -->
            <a href="index.html" class="logo">
                <div class="logo-image">
                    <img src="images/logo.jpg" 
                         alt="MBC - Maison des Bonnes Choses" 
                         onerror="this.onerror=null; this.style.display='none'; this.parentElement.classList.add('logo-fallback'); this.parentElement.innerHTML='<i class=\'fas fa-store\'></i><h1>M<span>BC</span></h1>'">
                </div>
            </a>

            <!-- Status badge avec l'heure d'ouverture -->
            <div class="status-badge" id="headerStatus" aria-live="polite">
                <i class="fas fa-clock" aria-hidden="true"></i>
                <span id="statusText">Ouvert 8h-22h</span>
            </div>

            <!-- Bouton menu mobile avec aria pour l'accessibilité -->
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu" aria-expanded="false">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>

            <!-- Navigation container -->
            <div class="nav-container" id="navContainer">
                <nav aria-label="Navigation principale">
                    <ul>
                        <li><a href="index.html" class="active">Accueil</a></li>
                        <li><a href="produits.html">Produits</a></li>
                        <li><a href="contact.html">Contact</a></li>
                        <li>
                            <a href="https://wa.me/22656323077" 
                               target="_blank" 
                               rel="noopener noreferrer" 
                               class="whatsapp-link">
                                <i class="fab fa-whatsapp" aria-hidden="true"></i> 
                                <span>WhatsApp</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</header>

<!-- Mobile Menu Overlay avec rôle pour accessibilité -->
<div class="mobile-menu-overlay" id="mobileMenuOverlay" role="presentation"></div>

<style>
    /* ===== STYLES POUR LE LOGO MBC ===== */
    .logo {
        display: flex;
        align-items: center;
        text-decoration: none;
    }
    
    .logo-image {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .logo-image img {
        height: 60px;
        width: auto;
        transition: transform 0.3s ease;
    }
    
    .logo-image img:hover {
        transform: scale(1.05);
    }
    
    /* Fallback élégant si l'image ne charge pas */
    .logo-fallback {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    
    .logo-fallback i {
        font-size: 2.2rem;
        color: #e67e22;
        background: white;
        padding: 10px;
        border-radius: 12px;
    }
    
    .logo-fallback h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: white;
        margin: 0;
        line-height: 1.2;
    }
    
    .logo-fallback h1 span {
        color: #e67e22;
    }
    
    /* Status badge */
    .status-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(46, 204, 113, 0.15);
        padding: 8px 16px;
        border-radius: 50px;
        border: 1px solid rgba(46, 204, 113, 0.3);
        color: white;
        font-size: 0.9rem;
        margin-left: auto;
        margin-right: 20px;
    }
    
    .status-badge i {
        color: #2ecc71;
    }
    
    /* Navigation */
    .nav-container ul {
        display: flex;
        align-items: center;
        gap: 25px;
        list-style: none;
        margin: 0;
        padding: 0;
    }
    
    .nav-container a {
        color: rgba(255, 255, 255, 0.9);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .nav-container a:hover,
    .nav-container a.active {
        color: #e67e22;
    }
    
    .whatsapp-link {
        background: #25D366;
        color: white !important;
        padding: 8px 20px;
        border-radius: 50px;
        transition: all 0.3s ease;
    }
    
    .whatsapp-link:hover {
        background: #128C7E;
        transform: translateY(-2px);
    }
    
    /* Menu mobile */
    .mobile-menu-btn {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        padding: 10px;
    }
    
    .mobile-menu-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
    }
    
    /* Responsive */
    @media (max-width: 992px) {
        .status-badge span:not(i) {
            display: none;
        }
        
        .status-badge {
            padding: 8px 12px;
        }
    }
    
    @media (max-width: 768px) {
        .header-content {
            flex-wrap: wrap;
        }
        
        .logo-image img {
            height: 50px;
        }
        
        .logo-fallback i {
            font-size: 1.8rem;
        }
        
        .logo-fallback h1 {
            font-size: 1.5rem;
        }
        
        .mobile-menu-btn {
            display: block;
            order: 3;
        }
        
        .status-badge {
            margin-right: 0;
            order: 2;
        }
        
        .nav-container {
            display: none;
            width: 100%;
            order: 4;
            margin-top: 20px;
        }
        
        .nav-container.active {
            display: block;
        }
        
        .nav-container ul {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .nav-container a {
            color: var(--primary-color);
        }
        
        .whatsapp-link {
            width: 100%;
            justify-content: center;
        }
    }
    
    @media (max-width: 480px) {
        .logo-image img {
            height: 45px;
        }
        
        .logo-fallback i {
            font-size: 1.5rem;
        }
        
        .logo-fallback h1 {
            font-size: 1.3rem;
        }
        
        .status-badge {
            padding: 6px 10px;
            font-size: 0.8rem;
        }
    }
</style>

<script>
    // Gestion du menu mobile
    document.addEventListener('DOMContentLoaded', function() {
        const menuBtn = document.getElementById('mobileMenuBtn');
        const navContainer = document.getElementById('navContainer');
        const overlay = document.getElementById('mobileMenuOverlay');
        
        if (menuBtn && navContainer) {
            function toggleMenu() {
                const isActive = navContainer.classList.contains('active');
                navContainer.classList.toggle('active');
                overlay.classList.toggle('active');
                menuBtn.setAttribute('aria-expanded', !isActive);
                menuBtn.innerHTML = isActive ? '<i class="fas fa-bars"></i>' : '<i class="fas fa-times"></i>';
            }
            
            menuBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
            
            // Fermer le menu au clic sur un lien
            document.querySelectorAll('.nav-container a').forEach(link => {
                link.addEventListener('click', () => {
                    navContainer.classList.remove('active');
                    overlay.classList.remove('active');
                    menuBtn.setAttribute('aria-expanded', 'false');
                    menuBtn.innerHTML = '<i class="fas fa-bars"></i>';
                });
            });
        }
        
        // Mettre à jour le statut (ouvert/fermé)
        const statusText = document.getElementById('statusText');
        if (statusText) {
            const now = new Date();
            const hours = now.getHours();
            const isOpen = hours >= 8 && hours < 22;
            statusText.innerHTML = isOpen ? 'Ouvert 8h-22h' : 'Fermé - Réouverture 8h';
            statusText.style.color = isOpen ? '#2ecc71' : '#e74c3c';
        }
    });
</script>
